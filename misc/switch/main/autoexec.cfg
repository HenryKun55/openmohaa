// OpenMoHAA — Nintendo Switch default config.
//
// IMPORTANT: this file runs on EVERY boot, AFTER configs/omconfig.cfg, so anything
// `set` here OVERRIDES (clobbers) what the player changed in the in-game menus.
// To keep player settings persistent, this file sets ONLY the hardware essentials
// the game can't default correctly on Switch — enabling the gamepad, the analog
// look feel, the controller button map, the native resolution, and sound-on.
// Everything else (volumes, mouse/look sensitivity, fps cap, intro, etc.) is left
// out on purpose so the player's choices live in omconfig.cfg and survive reboots.

// ---- Gamepad (read through the libnx HID; see sys_switch.c) ----
seta in_joystick            1
seta in_joystickNo          0
seta in_joystickUseAnalog   1
seta joy_threshold          0.15
// Analog-look feel (right stick); the PC defaults are mouse-based and wrong here.
seta j_yaw                 -0.011
seta j_pitch                0.011
seta m_pitch                0.022

// ---- Controller layout (SDL positional name = physical Switch button) ----
bind PAD0_RIGHTTRIGGER  "+attack"
bind PAD0_LEFTTRIGGER   "+attacksecondary"
bind PAD0_A             "+use"
bind PAD0_B             "+moveup"
bind PAD0_X             "reload"
bind PAD0_Y             "+movedown"
bind PAD0_LEFTSHOULDER  "weapprev"
bind PAD0_RIGHTSHOULDER "weapnext"
bind PAD0_LEFTSTICK_CLICK  "+leanleft"
bind PAD0_RIGHTSTICK_CLICK "+leanright"
bind PAD0_START         "togglemenu"
bind PAD0_BACK          "+scores"
bind PAD0_DPAD_UP       "+use"
bind PAD0_DPAD_LEFT     "weapprev"
bind PAD0_DPAD_RIGHT    "weapnext"
bind PAD0_DPAD_DOWN     "+movedown"
bind PAD0_LEFTSTICK_LEFT    "+moveleft"
bind PAD0_LEFTSTICK_RIGHT   "+moveright"
bind PAD0_LEFTSTICK_UP      "+forward"
bind PAD0_LEFTSTICK_DOWN    "+back"
bind PAD0_RIGHTSTICK_LEFT   "+left"
bind PAD0_RIGHTSTICK_RIGHT  "+right"
bind PAD0_RIGHTSTICK_UP     "+lookup"
bind PAD0_RIGHTSTICK_DOWN   "+lookdown"

// ---- Renderer: Switch native 720p (fixed; the player won't change this) ----
set  r_mode                 -1
set  r_customwidth          1280
set  r_customheight         720
set  r_fullscreen           1

// ---- Sound on (the mixer must be up; volumes are left to the menu/omconfig) ----
set  s_initsound            1
