// OpenMoHAA Vita -- initial visual settings.
//
// Executed ONCE, by the engine, the first time a build with a newer
// VITA_DEFAULTS_VERSION (qcommon/common.c) starts. After that your choices from the
// game's Options menus and the debug menu (double-tap Select) are saved in
// configs/omconfig.cfg and kept across launches: autoexec.cfg no longer sets any of
// these, so nothing overwrites them at boot.
//
// To go back to these values: "seta vita_defaults_ver 0" in the console, restart.

// World
seta r_drawworld              "1"
seta r_fastsky                "0"
seta r_drawSun                "0"

// Lighting / effects
seta r_dynamiclight           "0"
seta r_dlightBacks            "0"
seta cg_shadows               "0"
seta r_flares                 "0"
seta cg_marks_add             "0"
seta com_blood                "0"

// HUD / aim
seta ui_crosshair             "1"
seta cg_hud                   "1"
seta vita_skip_draw2d         "0"
seta vita_hip_sens            "9"
seta vita_aim_sens            "9"
seta cg_crosshair_hip         "1"
seta cg_crosshair_zoom        "1"

// Textures / detail
seta r_picmip                 "3"
seta r_lodbias                "4"
seta r_subdivisions           "2"
seta r_ext_compressed_textures "1"

// Vita renderer
seta r_vita_force_mtex        "1"
seta r_vita_vbo_world         "1"
seta r_vita_gpu_skinning      "1"
seta r_vita_perflog           "0"

// Audio / controls (the Options menus change these)
seta cl_run                   "1"
seta sensitivity              "5"
seta s_khz                    "22"
seta s_volume                 "1.0"
seta s_musicvolume            "1.0"

// Pad bindings (the Controls menu changes these; saved in omconfig.cfg)
bind PAD0_A             "+use"
bind PAD0_B             "+movedown"
bind PAD0_X             "reload"
bind PAD0_Y             "+moveup"
bind PAD0_LEFTSHOULDER  "+attacksecondary"
bind PAD0_RIGHTSHOULDER "+attack"
bind PAD0_BACK              "+vitaselect"
bind PAD0_START         "togglemenu"
bind PAD0_DPAD_LEFT     "weapprev"
bind PAD0_DPAD_RIGHT    "weapnext"
bind PAD0_DPAD_UP       "+use"
unbind PAD0_DPAD_DOWN
bind PAD0_LEFTSTICK_LEFT    "+moveleft"
bind PAD0_LEFTSTICK_RIGHT   "+moveright"
bind PAD0_LEFTSTICK_UP      "+forward"
bind PAD0_LEFTSTICK_DOWN    "+back"
bind PAD0_RIGHTSTICK_LEFT   "+left"
bind PAD0_RIGHTSTICK_RIGHT  "+right"
bind PAD0_RIGHTSTICK_UP     "+lookup"
bind PAD0_RIGHTSTICK_DOWN   "+lookdown"
