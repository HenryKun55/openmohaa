// OpenMoHAA — PlayStation Vita default bindings.
// Shipped inside the VPK at app0:/main/autoexec.cfg so the engine
// picks it up automatically (FS_Startup adds app0:/main to the search
// path). User overrides go in ux0:data/openmohaa/main/autoexec.cfg
// which is loaded after this one.

// ---- Input ----
// SDL2-Vita exposes the Vita pad as an SDL_GameController. We want
// analog sticks reporting smooth axes (USE_ANALOG) and a small dead-
// zone to keep the right stick from drifting the camera.
seta in_joystick            1
seta in_joystickNo          0
seta in_joystickUseAnalog   1
seta joy_threshold          0.15

// Right stick → look. The ACTUAL knob the engine reads for analog
// look speed is `j_yaw` / `j_pitch` (see cl_input.cpp:524-527):
//
//   yaw   = j_yaw   * cl.joystickAxis[j_yaw_axis]      (axis 2 = RX)
//   pitch = j_pitch * cl.joystickAxis[j_pitch_axis]    (axis 3 = RY)
//
// Engine defaults are j_yaw=-0.022, j_pitch=0.022 — the negative sign
// on j_yaw makes pushing right turn the camera right. (cl_yawspeed /
// cl_pitchspeed only apply to keyboard turn-keys; joy_yawsensitivity
// is not consumed by this engine.) For Vita we set them ~5x slower
// so the camera doesn't feel jet-propelled at full deflection.
//
// In-console tweaks (touch console toggle):
//   /j_yaw   -0.01  (slower)   /j_yaw   -0.02  (faster, near default)
//   /j_pitch  0.01  (slower)   /j_pitch  0.02  (faster, near default)
seta cl_run                 1
seta sensitivity            5
seta j_yaw                 -0.0045
seta j_pitch                0.0045
seta m_pitch                0.022

// Q3-style button names map directly onto Vita pad layout via
// SDL_GameController:
//   PAD0_A           = Cross
//   PAD0_B           = Circle
//   PAD0_X           = Square
//   PAD0_Y           = Triangle
//   PAD0_LEFTSHOULDER  = L
//   PAD0_RIGHTSHOULDER = R
//   PAD0_LEFTSTICK   = pressing the left stick in (L3)
//   PAD0_RIGHTSTICK  = pressing the right stick in (R3)
//   PAD0_BACK        = Select
//   PAD0_START       = Start
//   PAD0_DPAD_*      = D-pad

bind PAD0_A             "+attack"        // fire
bind PAD0_X             "+moveup"        // jump
bind PAD0_B             "+movedown"      // crouch / prone toggle on hold
bind PAD0_Y             "+useitem"       // reload / use
bind PAD0_LEFTSHOULDER  "+speed"         // walk (vs run)
bind PAD0_RIGHTSHOULDER "+zoom"          // iron sights / scope
bind PAD0_LEFTSTICK_CLICK   "+sprint"   // L3 press = sprint
bind PAD0_RIGHTSTICK_CLICK  "+leanleft" // R3 press = lean
bind PAD0_BACK          "+scores"        // Select shows objectives/score
bind PAD0_START         "togglemenu"     // Start opens menu

// D-pad selects weapon slots (matches WWII-shooter convention)
bind PAD0_DPAD_UP       "weapon 4"
bind PAD0_DPAD_DOWN     "weapon 5"
bind PAD0_DPAD_LEFT     "weapon 2"
bind PAD0_DPAD_RIGHT    "weapon 3"

// Analog sticks — Q3 fires axis events as virtual keys
// (LEFTSTICK_LEFT/RIGHT/UP/DOWN, RIGHTSTICK_*). For
// `in_joystickUseAnalog 1` the engine reads the BIND on each virtual
// axis key, sees a movement command, and converts the axis value into
// a SE_JOYSTICK_AXIS analog event — that's how the stick value scales
// the movement instead of being on/off.
// Left stick = movement
bind PAD0_LEFTSTICK_LEFT    "+moveleft"
bind PAD0_LEFTSTICK_RIGHT   "+moveright"
bind PAD0_LEFTSTICK_UP      "+forward"
bind PAD0_LEFTSTICK_DOWN    "+back"
// Right stick = look
bind PAD0_RIGHTSTICK_LEFT   "+left"
bind PAD0_RIGHTSTICK_RIGHT  "+right"
bind PAD0_RIGHTSTICK_UP     "+lookup"
bind PAD0_RIGHTSTICK_DOWN   "+lookdown"
// L/R triggers fire as axis events too, useful as aim/fire if shoulders
// are taken by lean/zoom (we keep them as binds on the shoulder buttons
// above; trigger binds left for the user to override).

// ---- Renderer ----
// PowerVR SGX543 is fillrate-limited; trim what we render at runtime.
// Use `set` (not `seta`) for render-critical cvars so omconfig.cfg can't
// override them on subsequent runs — the engine writes back r_mode=3,
// r_fullscreen=0 which break the 960x544 framebuffer.
set  r_mode                 -1
set  r_customwidth          960
set  r_customheight         544
set  r_fullscreen           1
// ---- Vita-tuned render settings ----
// Texture quality: 1 (1/2 size) is the sweet spot — 0 (full) eats too
// much GPU memory, 2 (1/4) made surfaces mushy.
seta r_picmip               1
// Dynamic lights re-enabled. The old "broken vertex" artefacts came
// from the multi-stage shader paths below, NOT from dlights themselves.
seta r_dynamiclight         1
seta r_dlightBacks          0       // only frontfaces get dlight pass
// LOD aggressive: more bias = simpler models at distance. Curves
// (subdivisions) coarser so vitaGL has fewer tris to retranslate.
seta r_lodbias              2
seta r_subdivisions         16
seta r_lodCurveError        250
seta r_swapInterval         1
// LIGHTING: keep lightmaps on — without them the world is flat-bright
// and m1l1's submarine interior loses all atmosphere. r_vertexLight 1
// dropped that data on the floor, which is why "tudo claro" earlier.
seta r_ext_vertex_shader    0
seta r_vertexLight          0
seta r_lightmap             1
seta r_lightlines           0
seta r_fastsky              1
// Cull distance — Vita has limited fill-rate; clip earlier.
seta r_znear                4
// Force the multitexture fast path (single-pass diffuse+lightmap).
seta r_ext_multitexture     1
// Cap to 30 FPS — stable 30 looks/plays better than swingy 20-60.
seta com_maxfps             30
// Single-thread renderer; vitaGL's GL state isn't fully thread-safe.
seta r_smp                  0
// Avoid the 2x lightmap brightness multiplier that vitaGL clamps
// incorrectly on SGX543.
seta r_overBrightBits       0
// Smaller shader cache → less GLSL translation to do at level load.
seta r_ext_compiled_vertex_array  1
// Force the engine onto the modern glDrawElements path. Default (0) lands
// on "multiple glArrayElement" which is the slowest fallback and known to
// be flaky on vitaGL. With glIndex_t pinned to uint16_t on Vita, the
// SCE_GXM_INDEX_FORMAT_U16 fast path is what vitaGL prefers.
set  r_primitives           2
// Surface GL errors instead of swallowing them — the menu currently
// renders as a black screen and we need to see if a GL_INVALID_OPERATION
// or similar is firing.
set  r_ignoreGLErrors       0

// ---- Sound ----
// Backend is OpenAL Soft 1.19.1 with isage's sceAudioOutOpenPort path.
// Use `set` so omconfig.cfg can't silence us — engine writes s_initsound
// back without touching volumes, but cl_playintro flips to 0 after first
// run which kills the intro.
set  s_khz                  22
seta s_mixahead             0.2
set  s_volume               1.0
set  s_musicvolume          1.0
set  s_ambientvolume        1.0
set  s_dialoguevolume       1.0
set  s_initsound            1
// Full intro flow: EA logo → MOHAA title → legal → main menu → mission 1
// → mission briefing → m1l1. Previously these were 1 to iterate fast on
// menu-render bugs; flipped back now that the pipeline is stable.
set  cl_playintro           1
set  ui_skip_eamovie        0
set  ui_skip_titlescreen    0
set  ui_skip_legalscreen    0

// ---- Misc ----
// com_developer was useful for debug log spam during bring-up but
// CL_TryStartIntro skips the intro cinematic when developer != 0
// (see code/client/cl_ui.cpp:4913). Leave it off so the EA / 2015 /
// MOHAA title videos actually play on startup.
set  com_developer          0
set  com_logfile            1

// (Removed bring-up shortcut: the briefing → m1l1 transition is no
// longer guaranteed to crash now that the C++ allocator is shared via
// the engine heap. Select goes back to its normal "+scores" binding.)
