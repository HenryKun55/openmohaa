// OpenMoHAA — PlayStation Vita default bindings.
// Shipped inside the VPK at app0:/main/autoexec.cfg so the engine
// picks it up automatically (FS_Startup adds app0:/main to the search
// path). User overrides go in ux0:data/openmohaa/main/autoexec.cfg
// which is loaded after this one.

// ---- Input ----
// SDL2-Vita exposes the Vita pad as an SDL_GameController. We want
// analog sticks reporting smooth axes (USE_ANALOG) and a small dead-
// zone to keep the right stick from drifting the camera.
seta in_joystick            1
seta in_joystickNo          0
seta in_joystickUseAnalog   1
seta joy_threshold          0.15

// Right stick → look. The ACTUAL knob the engine reads for analog
// look speed is `j_yaw` / `j_pitch` (see cl_input.cpp:524-527):
//
//   yaw   = j_yaw   * cl.joystickAxis[j_yaw_axis]      (axis 2 = RX)
//   pitch = j_pitch * cl.joystickAxis[j_pitch_axis]    (axis 3 = RY)
//
// Engine defaults are j_yaw=-0.022, j_pitch=0.022 — the negative sign
// on j_yaw makes pushing right turn the camera right. (cl_yawspeed /
// cl_pitchspeed only apply to keyboard turn-keys; joy_yawsensitivity
// is not consumed by this engine.) For Vita we set them ~5x slower
// so the camera doesn't feel jet-propelled at full deflection.
//
// In-console tweaks (touch console toggle):
//   /j_yaw   -0.01  (slower)   /j_yaw   -0.02  (faster, near default)
//   /j_pitch  0.01  (slower)   /j_pitch  0.02  (faster, near default)
seta cl_run                 1
seta sensitivity            5
seta j_yaw                 -0.0045
seta j_pitch                0.0045
seta m_pitch                0.022
// Vita-only per-state look-sensitivity multipliers (perf menu → AIM).
// Integer 0..10 = 0.0x..1.0x applied on top of j_yaw/j_pitch.
//   vita_hip_sens  look speed while NOT aiming (default 1.0x)
//   vita_aim_sens  look speed while aiming/zoomed (default 0.5x = steadier)
seta vita_hip_sens          10
seta vita_aim_sens          5

// Q3-style button names map directly onto Vita pad layout via
// SDL_GameController:
//   PAD0_A           = Cross
//   PAD0_B           = Circle
//   PAD0_X           = Square
//   PAD0_Y           = Triangle
//   PAD0_LEFTSHOULDER  = L
//   PAD0_RIGHTSHOULDER = R
//   PAD0_LEFTSTICK   = pressing the left stick in (L3)
//   PAD0_RIGHTSTICK  = pressing the right stick in (R3)
//   PAD0_BACK        = Select
//   PAD0_START       = Start
//   PAD0_DPAD_*      = D-pad

// Cross   = action / use
// Circle  = crouch (hold for prone)
// Square  = reload
// Triangle = jump
// L       = iron sights / zoom (MOHAA's "+attacksecondary" — `+zoom` doesn't exist)
// R       = fire (primary)
bind PAD0_A             "+use"
bind PAD0_B             "+movedown"
bind PAD0_X             "reload"
bind PAD0_Y             "+moveup"
bind PAD0_LEFTSHOULDER  "+attacksecondary"
bind PAD0_RIGHTSHOULDER "+attack"
// (PS Vita FAT has no L3 / R3 stick-click buttons — only Slim / PS TV do.
// LEFTSTICK_CLICK / RIGHTSTICK_CLICK binds wouldn't fire on Fat.)
bind PAD0_BACK          "+scores"          // Select shows objectives/score
bind PAD0_START         "togglemenu"       // Start opens menu

// D-pad: weapon cycling + debug helpers
bind PAD0_DPAD_LEFT     "weapprev"       // previous weapon
bind PAD0_DPAD_RIGHT    "weapnext"       // next weapon
bind PAD0_DPAD_UP       "+use"           // alternate "use" (open door / pick up)
// D-pad DOWN used to open the dev console (`devcon`), but on Vita the console
// grabs all input and there's no keyboard to close/use it — it just locked the
// player out of clicking menus. Unbound. The perf menu still reads DPAD_DOWN
// directly for navigation while open, so menu scrolling is unaffected.
unbind PAD0_DPAD_DOWN

// Analog sticks — Q3 fires axis events as virtual keys
// (LEFTSTICK_LEFT/RIGHT/UP/DOWN, RIGHTSTICK_*). For
// `in_joystickUseAnalog 1` the engine reads the BIND on each virtual
// axis key, sees a movement command, and converts the axis value into
// a SE_JOYSTICK_AXIS analog event — that's how the stick value scales
// the movement instead of being on/off.
// Left stick = movement
bind PAD0_LEFTSTICK_LEFT    "+moveleft"
bind PAD0_LEFTSTICK_RIGHT   "+moveright"
bind PAD0_LEFTSTICK_UP      "+forward"
bind PAD0_LEFTSTICK_DOWN    "+back"
// Right stick = look
bind PAD0_RIGHTSTICK_LEFT   "+left"
bind PAD0_RIGHTSTICK_RIGHT  "+right"
bind PAD0_RIGHTSTICK_UP     "+lookup"
bind PAD0_RIGHTSTICK_DOWN   "+lookdown"
// L/R triggers fire as axis events too, useful as aim/fire if shoulders
// are taken by lean/zoom (we keep them as binds on the shoulder buttons
// above; trigger binds left for the user to override).

// ---- Renderer ----
// PowerVR SGX543 is fillrate-limited; trim what we render at runtime.
// Use `set` (not `seta`) for render-critical cvars so omconfig.cfg can't
// override them on subsequent runs — the engine writes back r_mode=3,
// r_fullscreen=0 which break the 960x544 framebuffer.
set  r_mode                 -1
// CPU-bound — lower res didn't move FPS, revert to native LCD 960×544.
set  r_customwidth          960
set  r_customheight         544
set  r_fullscreen           1
// ---- Vita-tuned render settings ----
// 1 = textures at 1/2 size. Balance between visual + VRAM. Tested picmip 3
// — no FPS gain (we're not fillrate bound).
// USER-PREFERRED CONFIG (2026-05-19): the "bonitão" config that
// kept all lights/effects on except "Lightmap Only" debug. Matches
// what was set via the in-game perf menu before commit.
//
// IMPORTANT: using `set` (not `seta`) so the engine's archived
// omconfig.cfg can't override these on next launch. seta would
// otherwise be ignored when omconfig already has a different
// archived value — which is why the "bonitão" settings reverted
// across restarts.
set r_picmip                3       // user pushed to max in menu (3/3)
set r_dynamiclight          1       // muzzle / lamp / explosion lighting
set r_dlightBacks           1       // dlight covers backfaces too
// LOD aggressive: more bias = simpler models at distance. Curves
// (subdivisions) coarser so vitaGL has fewer tris to retranslate.
// MAX PERF — bumped from 2 → 3 (way simpler distant models).
set r_lodbias               4       // user pushed to max in menu (4/4)
set r_subdivisions          32      // MAX PERF — coarser curves (was 16/20)
seta r_lodCurveError        500     // MAX PERF — accept more curve error (was 250)
seta r_swapInterval         1
// LIGHTING: keep lightmaps on — without them the world is flat-bright
// and m1l1's submarine interior loses all atmosphere. r_vertexLight 1
// dropped that data on the floor, which is why "tudo claro" earlier.
seta r_ext_vertex_shader    0
set r_vertexLight           1    // user-preferred config: vertex lighting ON alongside lightmaps
set r_lightmap              0    // 0 = NORMAL (lightmaps + diffuse); 1 = debug "lightmap only". User had [ ] = OFF
seta r_lightlines           0
seta r_fastsky              1    // sky path flickers / duplicates on vitaGL — keep off
// Cull distance — Vita has limited fill-rate; clip earlier.
seta r_znear                4
// Force the multitexture fast path (single-pass diffuse+lightmap).
seta r_ext_multitexture     1
// Lock at 30 FPS for stable cadence — Vita Fat caps at ~5-15 FPS in dense
// m1l1 scenes regardless of cvar choice (GPU draw-call bound after the
// SF_FACE→SF_TRIANGLES conversion gave us BSP world rendering back).
// A swinging 5-30 FPS feels worse than a steady 30, so cap it.
seta com_maxfps             60
// SMP test result: no FPS gain. cl time stayed ~80-130ms. Reverting.
// Hypothesis: SMP introduces sync wait (frontend waits for backend
// flip), and since bk is already 0ms, the sync overhead alone hurts.
seta r_smp                  0
// Avoid the 2x lightmap brightness multiplier that vitaGL clamps
// incorrectly on SGX543.
seta r_overBrightBits       0
// PERF: half-precision texture storage (16-bit per pixel). Cuts VRAM
// bandwidth by 50% with minimal visual loss on 960×544. Was 32 by default.
seta r_textureBits          16
// PERF: drop lod even more for distant geometry. lodbias 3 already at
// limit; this knob biases curve subdivision similarly.
seta r_subdivisions         24    // engine clamps to max 24
// Disable glLockArraysEXT (compiled vertex array extension). vitaGL's
// implementation of this Q3-era optimization is suspected to scramble
// vertex layouts in some passes — the engine falls back to the safer
// direct-pointer path when this is 0.
seta r_ext_compiled_vertex_array  0
// DXT compressed textures from .dds files. R_LoadImage tries `.dds`
// before `.tga`/`.jpg` when TC_S3TC is on, then glCompressedTexImage2D
// uploads them as-is — 4-8x less VRAM, no decompression cost.
seta r_ext_compressed_textures    1
// ---- Aggressive Vita reduction ----
// Force MORE simplification: many Q3 shaders have multi-stage blends
// (diffuse × lightmap × scroll × dlight) that vitaGL's GLSL translator
// botches on SGX543, producing the "broken vertex / corrupt
// triangle" artefacts you see in m1l1. r_singleShader 1 replaces ALL
// shaders with a flat-white default (debug — easy to revert).
//   r_singleShader  1   debug: one shader for everything
//   r_singleShader  0   normal (default)
seta r_singleShader         0    // tested: bug persists even with single shader → bug is in GXM pipeline, not shader translation
// Kill heavyweight environmental effects that don't add much in
// indoor levels like m1l1.
set r_drawSun               1    // user wants sky/sun visible
set r_lensFlare             1    // user wants lens flares enabled
set r_flares                1    // user wants flares ON
seta r_marksOnTriangleMeshes 0
seta r_marksOnBrushes        0
// VITA-specific: shader paths that mangle geometry on vitaGL
seta r_drawfog              0    // volumetric fog adds an extra translucent pass
seta r_polygonOffset        0    // vitaGL's glPolygonOffset emulation is unreliable
// SUSPECT: shadow path uses qglBegin/qglEnd + qglLoadIdentity that
// might leave state corrupt → test with shadows off.
seta cg_shadows             1    // user wants stencil shadows ON
seta r_shadows              1    // shadow renderer matches cg setting
seta r_railWidth            16   // tighter rail beam → less overdraw
seta r_railSegmentLength    16
// Single shader source path — multiple-bind paths show vertex artefacts on m1l1
seta r_facePlaneCull        1    // skip backfaces explicitly
seta r_finish               0    // PERF: glFinish per frame was bring-up only; vitaGL syncs at swap
// Fase A: re-enabled. The Vita build now throttles printing to ~1×/sec
// and adds a "GPU: N draws M state K binds" line so we can confirm where
// the GPU is busy. Set back to 0 once the bottleneck is identified.
seta r_speeds               1
seta r_textureMode          GL_LINEAR_MIPMAP_NEAREST    // bilinear — GL_NEAREST gave no FPS gain
// Reduce dlight count to 4 simultaneous (default 32).
seta r_maxdlights           4
// Distance culling kept moderate so close walls don't pop.
seta r_lodbias              2
seta r_lodCurveError        150
// Force the engine onto the modern glDrawElements path. Default (0) lands
// on "multiple glArrayElement" which is the slowest fallback and known to
// be flaky on vitaGL. With glIndex_t pinned to uint16_t on Vita, the
// SCE_GXM_INDEX_FORMAT_U16 fast path is what vitaGL prefers.
set  r_primitives           2
// Surface GL errors instead of swallowing them — the menu currently
// renders as a black screen and we need to see if a GL_INVALID_OPERATION
// or similar is firing.
set  r_ignoreGLErrors       0

// ---- Sound ----
// Backend is OpenAL Soft 1.19.1 with isage's sceAudioOutOpenPort path.
// Use `set` so omconfig.cfg can't silence us — engine writes s_initsound
// back without touching volumes, but cl_playintro flips to 0 after first
// run which kills the intro.
set  s_khz                  22    // 11kHz didn't help cl time, restore quality
seta s_mixahead             0.2
set  s_volume               1.0
set  s_musicvolume          1.0
set  s_ambientvolume        1.0
set  s_dialoguevolume       1.0
set  s_initsound            1    // s_initsound 0 crashes (engine assumes mixer initialized). Reduce cost via s_khz instead
// Full intro flow: EA logo → MOHAA title → legal → main menu → mission 1
// → mission briefing → m1l1. Previously these were 1 to iterate fast on
// menu-render bugs; flipped back now that the pipeline is stable.
set  cl_playintro           1
set  ui_skip_eamovie        0
set  ui_skip_titlescreen    0
set  ui_skip_legalscreen    0

// ---- Misc ----
// com_developer was useful for debug log spam during bring-up but
// CL_TryStartIntro skips the intro cinematic when developer != 0
// (see code/client/cl_ui.cpp:4913). Leave it off so the EA / 2015 /
// MOHAA title videos actually play on startup.
set  com_developer          0
set  com_logfile            1    // MEASURE: capture com_speeds breakdown

// ---- Gameplay debug ----
// Show the weapon model in first-person view (1=on, 0=hidden).
set  cg_drawGun             1
// HUD test proved widgets aren't the bottleneck — view3d->Display is.
// Restore HUD for normal gameplay. seta because cg_hud is registered with
// default "0" and no CVAR_ARCHIVE flag — plain `set` lost the value across
// init sequencing and killed the crosshair (CG_DrawCrosshair gates on it).
seta cg_hud                 1
seta ui_crosshair           1
set  cg_3rdperson           0
// MEASURE: actual FPS in corner
set  cg_drawFPS             1
// MEASURE: per-frame CPU breakdown (frontend ms / backend ms / GL ms)
set  com_speeds             1
// Cheats let `give all` (D-pad up) work for spawn-with-arsenal debug.
seta sv_cheats              1
seta cheats                 1
// ---- DIAGNOSTIC: kill explosion / particle effects ----
// User reports vertex corruption STARTS the moment the m1l1 truck
// explodes — the explosion shader (multi-stage fire+smoke+flash with
// additive blends and animated textures) leaves vitaGL's GL state in
// a mode that subsequent world rendering inherits, producing the
// "all vertices broken from here on" symptom. Drop the most likely
// culprits so we can isolate which one matters.
seta cg_marks_add           1    // user wants decals/bullet holes ON
seta cg_marks_max           256  // enable some history of marks
set  com_blood              1    // user wants gore particles
seta cg_drawCorona          1    // user wants coronas ON
seta cg_drawCrosshair       1
// Vita-only independent crosshair toggles (perf menu → EFFECTS):
//   cg_crosshair_hip   show crosshair while NOT aiming (hip fire)
//   cg_crosshair_zoom  show crosshair while aiming (iron sights / zoom)
// Both default ON; CVAR_ARCHIVE so menu changes persist across launches.
seta cg_crosshair_hip       1
seta cg_crosshair_zoom      1

// (Removed bring-up shortcut: the briefing → m1l1 transition is no
// longer guaranteed to crash now that the C++ allocator is shared via
// the engine heap. Select goes back to its normal "+scores" binding.)

// Skip View3D::Draw2D — tested 1, FPS unchanged (GPU is the wait, not Draw2D).
// Leave hook in code as documented escape hatch.
seta vita_skip_draw2d       0

// ---- IN-GAME PERF MENU (tree) ----
// Press Select (PAD0_BACK) to open the in-game perf menu overlay.
// D-pad LEFT/RIGHT changes category. UP/DOWN selects item. A toggles.
// B or Select closes. While open, ALL gameplay keys are blocked.
seta r_drawworld            1
bind PAD0_BACK              "perfmenu"

// ---- PHASE 1: World BSP VBO (Vita-only) ----
// 0 = current path (client arrays, vitaGL re-copies every frame)
// 1 = build VBO at level load + use it in the draw path.
//
// Phase 1b proper: dual-TMU works for single-pass multitexture,
// but multipass shaders (some BSP walls draw diffuse + lightmap as
// 2 separate passes both using TMU 0) still see wrong UVs in pass 2.
// Disabled until Phase 1b multipass-aware lands.
// Phase 1 (2026-05-19): re-enabling with Phase 3 multitexture also on.
// Pre-Phase-3, most BSP walls used 2-pass shaders (diffuse + lightmap)
// and the VBO draw path only bound ONE texCoord pointer per draw —
// the lightmap pass sampled with diffuse UVs and walls came out
// smeared. Now Phase 3 (CollapseMultitexture) collapses ~95% of
// those into single multitex stages, so the VBO path mostly hits
// the OK single-stage case. The remaining ~5% (Phase 1b proper-
// proper territory) may still glitch — toggle 0 via perf menu →
// DEBUG if visible.
seta r_vita_vbo_world       1

// Phase 3 (2026-05-19): force multitexture on Vita. vitaGL exposes
// GL_ARB_multitexture but SDL_GL_ExtensionSupported() can't see it,
// so we bind the static functions directly. This activates
// CollapseMultitexture in tr_shader.c and collapses ~95% of BSP
// shaders to single multitex stage instead of 2 passes. Visual
// confirmed correct after GL_MODULATE fix on TMU 0 in
// DrawMultitextured (tr_shade.c).
seta r_vita_force_mtex      1

// Per-frame instrumentation. Set 0 to remove the timing overhead
// once the bottleneck is identified.
seta r_vita_perflog         1

// "Light Spheres" debug visualization (Q3 debug feature) — user had ON
set r_drawSpheres           1

// ---- USER PERF-MINIMUM CONFIG (2026-05-19) ----
// User requested: leave ONLY what's needed for the scene to be
// drawable; strip every effect/light/debug feature for a baseline
// measurement of the absolute-minimum render cost. Use `set` so
// omconfig.cfg can't override on next launch.

// WORLD: world + brush models + static models/polys + curves ON;
//        entity polys, fast sky, sky box OFF.
set r_drawworld             1
set r_drawbrushes           1
set r_drawstaticmodels      1
set r_drawstaticmodelpoly   1
set r_drawentitypoly        0
set r_nocurves              0     // 0 = Curves ON
set r_fastsky               0
set r_drawSun               0

// LIGHTING: everything OFF (no dynamic lights, no shadows, no
// lightmap-only, no spheres/coronas/flares).
set r_dynamiclight          0
set r_dlightBacks           0
set r_vertexLight           0
set r_lightmap              0
set r_drawSpheres           0
set cg_shadows              0
set r_shadows               0
set cg_drawCorona           0
set r_flares                0

// EFFECTS: only Engine 2D Pass ON (vita_skip_draw2d=0 means the
// engine's 2D pass runs normally). Everything else off — no
// decals, no blood, no weapon model, no crosshair, no HUD.
set vita_skip_draw2d        0
set cg_marks_add            0
set cg_marks_max            0
set com_blood               0
set cg_drawGun              0
set ui_crosshair            0
set cg_drawCrosshair        0
set cg_hud                  0

// TEXTURES: everything at minimum quality.
set r_picmip                3     // max picmip (smallest textures)
set r_lodbias               4     // max lod bias (simplest distant geometry)
set r_subdivisions          1     // curves: 1 = absolutely coarsest
set r_lodCurveError         500

// DEBUG: every diag/instrumentation off.
set r_norefresh             0
set r_showtris              0
set r_shownormals           0
set r_speeds                0
set com_speeds              0
set r_vita_perflog          0
set r_vita_force_mtex       0    // Phase 3 disabled for baseline
set r_vita_vbo_world        0    // Phase 1 disabled for baseline

// Phase 2a: GPU skinning shader. Default OFF in minimum-baseline
// config — the Phase 2b draw path it would have enabled also stays
// off. Toggle via the perf-menu / console if you want to re-enable.
set r_vita_gpu_skinning     0

// ---- VITA RENDER SUBSYSTEM BISECT ----
// First test (mask=63) ruled out 6 subsystems. Adding BSP world bits.
//   bit 0  (  1) SF_TIKI_SKEL    NPCs
//   bit 1  (  2) SF_TIKI_STATIC  static props
//   bit 2  (  4) SF_SWIPE        melee trails
//   bit 3  (  8) SF_SPRITE       billboards
//   bit 4  ( 16) SF_TERRAIN      terrain patches
//   bit 5  ( 32) sky iterator
//   bit 6  ( 64) SF_FACE         BSP brush faces (walls, floors)
//   bit 7  (128) SF_TRIANGLES    generic tri surfaces
//   bit 8  (256) SF_GRID         curved patches
//
// At first surface render the engine prints:
//   [VITA] first surface vita_skip_mask=N (raw="N")
// open console with D-pad DOWN and confirm N matches what you set.
//
//   192 = no FACE + no TRIANGLES (keep GRID curves → can still see something)
//   320 = no FACE + no GRID
//   384 = no TRIANGLES + no GRID
//   448 = no FACE+TRIS+GRID  (will likely be black screen)
//    64 = no FACE only
//   128 = no TRIANGLES only
//   256 = no GRID only
// Tess-write rewrite did NOT fix corruption (verified) — bug isn't in
// what FACE writes, it's downstream in the actual draw / shader stage.
// Back to mask=192 = playable baseline.
seta vita_skip_mask         0      // FACE conversion: BSP loader emits SF_TRIANGLES for brush faces, FACE iterator bypassed

// (Removed leftover `seta r_speeds 1` that was undoing the minimum
// config block above. r_speeds is now set explicitly in the
// "DEBUG: every diag/instrumentation off" block.)

// ---- DEV WARP: boot straight into a given map ----
// Uncomment ONE of these to skip the main menu and load directly into
// that level. We use `wait N; spmap M` because plain `spmap` at the end
// of autoexec runs before the title screen/menu initialise, and the
// menu init drowns the queued map load. `wait 300` ≈ 5 seconds at 60 Hz
// frame-counted waits, which is past the eamovie/title screen and into
// the menu where spmap takes effect cleanly.
//wait 300; spmap m1l1
//wait 300; spmap m1l2a
//wait 300; spmap m1l3
